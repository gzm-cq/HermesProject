name: knowledge-tree-plugin
version: 0.1.0
description: 知识树在线插件 — post_llm_call 增量学习（pre_llm_call 由 knowledge-navigation 统一负责）
author: Hermes Team
license: MIT
hooks:
  post_llm_call:
    callback: post_llm_call
    description: 在每次 LLM 调用后，分析对话提取新知识点并存入知识树
    enabled: true
dependencies:
  - requests>=2.25.0
  - typer>=0.9.0
  - numpy>=1.24.0
  - psycopg2-binary>=2.9.0
  - pgvector
  - PyYAML>=6.0
optional_dependencies:
  - knowledge-navigation>=1.1.0   # turn_gate 门控函数；不可用时降级为全放行
  # 注：关键词提取等共享工具现统一来自 hermes-common 库（部署至 /root/.hermes/lib/hermes_common），
  # 由本插件 __init__ 显式注入 libs/hermes_common；它不是 Hermes 插件，故不在 plugin 依赖列表内。
