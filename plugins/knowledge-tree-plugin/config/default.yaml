# 知识树插件配置
# 大部分配置可通过环境变量覆盖

# 数据库
db_url: ""                            # PG 连接串；默认从 KT_DB_URL 环境变量读取

# 知识树 recall 参数（pre_llm_call）
max_recall_results: 5                 # 最多返回知识点数
recall_min_score: 0.3                 # 注意力筛选最小分数
cold_start_threshold: 20              # 子节点数 < 此值 → 回退余弦相似度定位

# 知识提取参数（post_llm_call）
extract_enabled: true                 # 是否启用 post_llm_call 自动提取
extract_min_dialog_length: 50         # 对话长度至少多少字符才尝试提取
extract_max_input_length: 4000        # 输入 LLM 提取的最大字符数
min_knowledge_point_length: 10        # 准入最小字数
extract_llm_timeout_seconds: 45       # 在线提取 LLM read timeout（从 30s 提升，减少超时失败）
extract_llm_retries: 2                # 在线提取重试次数（从 1 提升，增加可靠性）

# LLM（post_llm_call 提取用）
llm_api_url: "http://127.0.0.1:4142/v1/chat/completions"
llm_api_key: ""                       # 默认从 LITELLM_MASTER_KEY 环境变量读取
llm_model: "s-deepseek-v4-flash"

# Embedding（recall + 增量放置用）
embed_base_url: "https://api.siliconflow.cn/v1"
embed_model: "BAAI/bge-m3"
embed_api_key: ""                     # 默认从 HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY 变量读取
embed_batch_size: 20

# 去重
dedup_cosine_threshold: 0.95          # 去重余弦相似度阈值
conflict_cosine_threshold: 0.80       # 矛盾检测阈值

# K 向量更新
k_vector_alpha_max: 0.1              # 指数移动平均 alpha 上限
