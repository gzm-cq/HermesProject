name: knowledge-navigation
version: 1.5.0
description: 知识导航插件 — LLM Router 五路召回，自动召回 Hindsight 经验 + 知识树 + Skill + SAG + CodeGraph 符号级代码
author: Hermes Team
license: MIT
homepage: https://github.com/hermes-ai/knowledge-navigation
hooks:
  pre_llm_call:
    callback: pre_llm_call
    description: 在每次 LLM 调用前通过 LLM Router 智能决策五路召回（HS/KT/Skill/SAG + CodeGraph 符号级）并注入上下文
    enabled: true
dependencies:
  - requests>=2.25.0
  - httpx>=0.24.0
  - typer>=0.9.0
  - psycopg2-binary>=2.9.0   # PG 连接（因果链查询用）
