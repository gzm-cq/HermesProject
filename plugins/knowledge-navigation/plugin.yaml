name: knowledge-navigation
version: 1.2.0
description: 知识导航插件 — LLM Router 三路注入，自动召回 Hindsight 经验 + 知识树 + Skill
author: Hermes Team
license: MIT
homepage: https://github.com/hermes-ai/knowledge-navigation
hooks:
  pre_llm_call:
    callback: pre_llm_call
    description: 在每次 LLM 调用前通过 LLM Router 智能决策三路召回并注入上下文
    enabled: true
dependencies:
  - requests>=2.25.0
  - httpx>=0.24.0
  - typer>=0.9.0
  - psycopg2-binary>=2.9.0   # PG 连接（因果链查询用）
