name: knowledge-navigation
version: 1.1.0
description: 知识导航 — 自动 recall Hindsight 注入上下文（优化版）
author: Hermes Team
license: MIT
homepage: https://github.com/hermes-ai/knowledge-navigation
hooks:
  pre_llm_call:
    callback: pre_llm_call
    description: 在每次 LLM 调用前自动召回相关记忆并注入上下文
    enabled: true
dependencies:
  - requests>=2.25.0
  - typer>=0.9.0
  - psycopg2-binary>=2.9.0   # PG 连接（因果链查询用）
