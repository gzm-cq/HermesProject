[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-navigation"
version = "1.1.0"
description = "知识导航 — 自动 recall Hindsight 注入上下文（优化版）"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Hermes Team", email = "team@hermes.ai"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["hermes", "hindsight", "llm", "memory", "plugin"]
dependencies = [
    "requests>=2.25.0,<3.0.0",
    "typer>=0.9.0",
    "psycopg2-binary>=2.9.0",           # PG 连接（因果链查询用）
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/hermes-ai/knowledge-navigation"
Repository = "https://github.com/hermes-ai/knowledge-navigation"

# ============================================================
# 入口点配置
# ============================================================

[project.entry-points.console_scripts]
"knowledge-navigation" = "knowledge_navigation.cli:main"

[project.entry-points."hermes.plugins"]
"knowledge-navigation" = "knowledge_navigation:register"

# ============================================================
# Setuptools 配置（src layout 必需）
# ============================================================

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

# ============================================================
# 工具配置
# ============================================================

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # function call in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["knowledge_navigation"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "unit: unit tests",
    "integration: integration tests (require external services)",
    "e2e: end-to-end tests",
]
