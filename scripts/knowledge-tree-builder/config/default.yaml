# Default configuration for knowledge-tree-builder
# 知识分域建树管线 默认配置

# db_url 通过环境变量 KT_DB_URL 注入（无需在此写入）

# === 输入源 ===
input_dir: "references"            # 输入文章目录（相对于项目根，或绝对路径）

# === LLM 参数 ===
llm_api_url: "http://127.0.0.1:4142/v1/chat/completions"
llm_api_key: ""                    # 通过 LITELLM_MASTER_KEY 环境变量注入
llm_model: "s-deepseek-v4-flash"
extract_temperature: 0             # 提取时 temperature=0 避免随机波动
max_tokens: 2048

# === Embedding 参数 ===
embed_base_url: "https://api.siliconflow.cn/v1"
embed_model: "BAAI/bge-m3"
embed_api_key: ""                  # 通过 HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY 注入
embed_batch_size: 20

# === 新管线参数（迁移后旧参数不再使用）===

# 阶段1：知识点提取
max_candidates_per_article: 15     # 候选数上限 (K)
article_max_chars: 12000           # 文章截断长度

# 阶段2：拆解与校验
split_max_rounds: 2                # 拆解轮数上限 (R_max)
self_explanatory_rules: true       # 启用自解释检查

# 阶段3：准入与去重
dedup_threshold_direct: 0.95       # 直接判重阈值（cosine > 此值直接视为重复）
dedup_threshold_llm: 0.90          # LLM 确认区间下界（0.90~0.95 进入 LLM）
dedup_batch_size: 5                # LLM 去重确认批大小
conflict_threshold: 0.80           # 矛盾检测余弦阈值
cold_start_text_dedup_count: 50    # < 此数量时启用纯文本去重

# P2-1: 增强门控
enhanced_admission: true           # 是否启用增强门控（Feature Flag）
admission_whitelist_sources: []    # 白名单来源前缀列表（如 ["docs.python.org", "postgresql.org"]）
admission_low_quality_patterns: true  # 是否启用低质量模式检测

# 阶段4：树定位（无规则表，LLM 判断领域，有就入没有就建）
subject_match_threshold: 0.70           # 科目匹配 cosine 阈值
cold_start_article_count: 3             # < 此数量时启用冷启动建科目

# === 旧参数（废弃，迁移后移除）===
# 以下参数属于旧 HDBSCAN 聚类管线，新管线不再使用
# min_cluster_size: 5
# cluster_selection_method: "eom"
# max_subcluster_depth: 5
