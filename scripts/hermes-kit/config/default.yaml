# Hermes-Kit 默认配置
# 复制到 ~/.hermes-kit/config.yaml 后生效
# install.sh 首次安装时自动从本模板复制

kit:
  version: "1.2"
  log_level: info

# 五路召回（mask 四路 + CodeGraph 符号级）
recall:
  knowledge_tree:
    enabled: true
    top_k: 5
  hindsight:
    enabled: true
    top_k: 10
  skill:
    enabled: true
    top_k: 3
  sag:
    enabled: true
    top_k: 5
  codegraph:
    enabled: true
    limit: 5

# 聚类分析
clustering:
  enabled: true
  min_cluster_size: 5
  silhouette_threshold: 0.05
  # read-only: 实际阈值由子项目 config/default.yaml 控制

# 知识树
knowledge_tree:
  enabled: true
  consolidate:
    enabled: true
    min_sub_nodes: 5
    max_split_size: 50
    # read-only: 实际阈值由子项目 config/default.yaml 控制
  k_vector:
    enabled: true

# 记忆清理
memory_cleanup:
  enabled: true
  dry_run: true
  vote_threshold: 1

# Skill 优化
skill_optimization:
  enabled: true
  top_k: 5
  auto_apply: false
  # read-only: 实际配置由 skillopt-runner/config.yaml 控制

# 系统巡检
system_health:
  enabled: true
  schedule: "0 8 * * 1-5"

# 通知
notification:
  channel: feishu
  home_chat_id: "${HERMES_KIT_HOME_CHAT_ID:-}"
  # home_chat_id 从 .env 注入，不硬编码到模板

# cron 调度时间（install/upgrade 从此读取，不再硬编码在脚本中）
cron:
  system_health: "0 8 * * 1-5"
  health_report: "0 8 * * *"
  daily_learn: "0 9 * * 1-5"
  kvector_maintenance: "0 9 * * 6"
  deep_research: "0 9 * * 0"
  clustering: "0 10 * * 1"
  knowledge_tree_consolidate: "0 11 * * 1"
  kn_baseline: "0 12 * * *"
  # skill_eval 已合并到 flywheel-health-report runner 阶段 0，不再需要独立 cron 调度
  memory_cleanup: "0 13 * * *"
  router_health: "0 14 * * *"
  skill_optimization: "0 15 * * *"
  dream_daily: "0 16 * * *"
  cron_detect: "0 * * * *"

# 插件运行时参数（知识导航插件从此读取，优先级高于 .env）
plugin_config:
  kn_min_score: 0.6
  kn_max_results: 3
  kn_max_text_length: 200
  kn_timeout_seconds: 30
  kn_max_retries: 2
  kn_enable_temporal: true
  kn_temporal_halflife: 30
  kn_temporal_floor_weight: 0.5
  kn_router_model: "s-deepseek-v4-flash"
  kn_router_timeout: 15
  kn_skill_embedding_prescreen: false
  kn_skill_embedding_top_k: 20
  kn_skill_index_incremental: true
  sag_search_top_k: 3
  sag_search_timeout: 10
  sag_max_inject: 3
  sag_pointer_threshold: 300
  sag_min_score: 0.35
  token_budget_total: 4000
  token_budget_hindsight_ratio: 0.4
  token_budget_kt_ratio: 0.4
  token_budget_skill_ratio: 0.2
  lambda_mrr: 0.5
  eval_min_score: 0.1
  eval_match_enabled: true
  cross_domain_dedup_mode: "text_only"
  cross_domain_dedup_action: "demote"
  cross_domain_dedup_demote_factor: 0.5
  turn_to_turn_dedup_mode: "demote"
  circuit_breaker_threshold: 3
  circuit_breaker_cooldown: 120
  causal_boost_alpha: 0.15
  causal_boost_cap: 1.3
  enable_score_span_compress: true
  score_span_top3_threshold: 0.9
  score_span_half_threshold: 0.7
  enable_causal_chain: true
  enable_token_budget: false
  enable_use_log: true
  use_log_batch_size: 10
  use_log_flush_interval_seconds: 30
