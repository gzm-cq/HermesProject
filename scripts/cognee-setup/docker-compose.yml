# Cognee 知识图谱服务（P0-2，见 docs/融合计划/20260822-数据飞轮增强执行方案.md §2.2）
#
# 2026-08-23 修订：原 Docker 镜像路线已废弃。
#   - cognee-mcp 官方仅发布 Docker 镜像（ghcr.io/cognee/cognee-mcp），
#     本机对 ghcr.io / Docker Hub 主站均不可达，且国内镜像源（1ms.run /
#     xuanyuan / 1panel / daocloud / 腾讯云 / 阿里云）均不缓存该第三方仓库，
#     **任何国内镜像都拉不到此镜像**。
#   - 经核实：cognee-mcp 实为 Python 包（PyPI: cognee-mcp 0.5.5，入口命令
#     `cognee-mcp`），依赖 `cognee[postgres-binary,docs,neo4j]`。PyPI 清华 /
#     阿里云镜像在本机可达（HTTP 200），故改用 **pip 安装** 路线，无需镜像。
#
# 组件分工：
#   - neo4j：仍用 Docker 官方镜像（docker.1ms.run/library/neo4j 已验证可拉）。
#   - cognee-mcp：pip 安装到 /root/.hermes/cognee-mcp-pkg，由 Hermes 核心
#     以 stdio 方式拉起（注册到 /root/.hermes/config.yaml 的 mcp_servers 段，
#     改配置不破"不动核心源码"约束）。
#
# 仅修改 Hermes 核心 MCP 配置注册本服务，不改核心源码（符合约束口径）。

services:
  neo4j:
    image: docker.1ms.run/library/neo4j:5.23-community
    container_name: hermes-cognee-neo4j
    environment:
      NEO4J_AUTH: neo4j/cognee1234
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_auth__minimum__password__length: "4"
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - cognee-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  cognee-neo4j-data:
