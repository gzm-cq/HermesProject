# dream-synth 每日流水线配置

# Session 提取
session:
  min_messages: 10
  min_tokens: 2000
  db_path: "/root/.hermes/state.db"

# LLM 模型
llm:
  cheap: "s-deepseek-v4-flash"
  smart: "s-deepseek-v4-flash"
  base_url: "http://127.0.0.1:4142"
  throttle_seconds: 0.0    # LLM 调用间隔限流，默认 0（不限流）
  promote_workers: 1       # promote 阶段 LLM 判断并发数，默认 1（串行）

# SAG REST API（Fastify, 端口 4173）
sag:
  base_url: "http://127.0.0.1:4173"
  ingest_workers: 3        # SAG ingest 并发数，默认 3

# 飞书
feishu:
  chat_id: ""   # 留空：由环境变量 FEISHU_CHAT_ID 提供；两者皆空则跳过飞书推送

# 晋升控制环（F-3）：promote 阶段晋升门槛。
# 运行时可被 HERMES_HOME/.env 的 DREAM_PROMOTE_THRESHOLD 覆盖（由 auto-tuner
# 基于 kn_judge_relevant_rate_sag 反馈动态调优）。score >= threshold 才允许晋升。
promote:
  threshold: 0.6

# Wiki
wiki:
  base_path: "/mnt/c/Users/1/Desktop/AI/my-knowledge/axiom/wiki/pages"

# 缓存（持久化路径，重启不丢失）
cache:
  verdict_dir: "/root/.hermes/cache/dream-synth/verdicts"
  promote_log: "/root/.hermes/cache/dream-synth/promote-log.json"
  pattern_log: "/root/.hermes/cache/dream-synth/pattern-log.json"
  feishu_log: "/root/.hermes/cache/dream-synth/feishu-log.json"