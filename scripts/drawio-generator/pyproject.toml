[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drawio-generator"
version = "1.2.0"
description = "Draw.io/SVG 矢量图生成引擎 - 根据结构化布局 JSON 渲染矢量图"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hermes Project"},
]
maintainers = [
    {name = "Hermes Project"},
]
keywords = ["drawio", "svg", "diagram", "visualization", "graph"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/HermesProject/drawio-generator"
Repository = "https://github.com/HermesProject/drawio-generator"
Documentation = "https://github.com/HermesProject/drawio-generator#readme"
"Issue tracker" = "https://github.com/HermesProject/drawio-generator/issues"

[project.scripts]
drawio-render = "drawio_generator.render:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["drawio_generator*"]

[tool.setuptools.package-data]
drawio_generator = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
