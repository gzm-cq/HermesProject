# Default configuration for memory-cleanup
# 所有字段均可通过 MEMORY_CLEANUP_* 环境变量覆盖（见 config.py）

# ── 输出模式 ──
# output_mode: "human"    # "human" 或 "json"（可通过 MEMORY_CLEANUP_OUTPUT_MODE 设置）

# ── 文件路径 ──
memory_path: "/root/.hermes/memories/MEMORY.md"
user_path: "/root/.hermes/memories/USER.md"
session_db_path: "/root/.hermes/state.db"
hermes_agent_path: "/root/.hermes/hermes-agent"

# ── LLM 参数 ──
llm_url: "http://127.0.0.1:4142/v1/chat/completions"
llm_model: "s-deepseek-v4-flash"
# llm_key: 通过 LITELLM_MASTER_KEY 环境变量注入

# ── Hindsight API ──
hindsight_url: "http://127.0.0.1:9177/v1/default/banks/hermes/memories"

# ── 并发与批处理 ──
batch_size: 10
user_batch_size: 10
vote_count: 1          # 投票轮数（>1 时 remove 并集、其他决策取交集，推荐 cron 用 2）
# max_workers: 自动根据 CPU 核心数计算（min(32, cpu+4)）

# ── 字符限制 ──
memory_char_limit: 50000
user_char_limit: 15000

# ── 日志 ──
log_level: "INFO"
