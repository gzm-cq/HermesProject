[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "p0-benchmark"
version = "0.1.0"
description = "P0 优化 Benchmark 测试框架"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
p0-benchmark = "p0_benchmark.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
