[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-gateway"
version = "0.1.0"
description = "Hermes Agent Gateway for messaging platform integration"
authors = [{name = "You", email = "you@example.com"}]
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/your-org/hermes"
