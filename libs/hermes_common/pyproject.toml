[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-common"
version = "0.1.0"
description = "Hermes 统一共享库 — 跨脚本层与插件层复用的纯 stdlib 工具（账本 / LLM 护栏 / 文本处理）"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Hermes Team", email = "team@hermes.ai"},
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "black>=24.0",
]

[project.urls]
Homepage = "https://github.com/hermes-ai/hermes-common"
Repository = "https://github.com/hermes-ai/hermes-common"

# 扁平布局：包 hermes_common 直接位于项目根，部署时整体拷到 /root/.hermes/lib/hermes_common
[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_common*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["hermes_common"]
